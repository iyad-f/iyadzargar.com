version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      app-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /caddy
    schedule:
      interval: weekly
    groups:
      caddy-minor-patch:
        update-types: [minor, patch]
