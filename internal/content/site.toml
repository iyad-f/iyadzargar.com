[about]
bio = [
  "I have been programming for the better part of a decade. The first couple of years were on and off, but it has been steady ever since. What I fell for was not a language or a framework. It was computer science itself, the whole of it.",
  "What pulls me hardest is the layer underneath. I want to know how a programming language turns your file into something that runs, what a database does beneath a query, how bytes move once they leave a socket. From network programming to resilient systems, cryptography to compiler internals, I stay curious and pragmatic with it. I do not know everything. I just cannot stop wanting to find out.",
]

